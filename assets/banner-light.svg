<text x="595" y="268" class="m" font-size="12" text-anchor="middle" fill="#17181a">Enter ↵</text>
</g>
</g>
<g class="hide-until" style="animation-duration:2.85s">
<g class="rise" style="animation-delay:2.85s"><circle cx="59" cy="58" r="3" fill="#2f8f57"/><text x="72" y="62" class="m" font-size="12" letter-spacing="2.2" fill="#6a6964">GDS · FINANCE AT BOCCONI · MILAN</text></g>
<g class="rise" style="animation-delay:2.94s"><text x="53" y="142" class="s" font-size="68" font-weight="300" letter-spacing="-2.6" fill="#17181a">Giovanni <tspan font-weight="650">De Stasio</tspan></text></g>
<g class="rise" style="animation-delay:3.0500000000000003s"><text x="56" y="188" class="s" font-size="20" fill="#6a6964">I study financial markets, build <tspan fill="#17181a" font-weight="600">trading systems</tspan> and develop <tspan fill="#17181a" font-weight="600">apps</tspan>.</text></g>
<g class="fade" style="animation-delay:3.2s">
<line x1="56" x2="844" y1="262" y2="262" stroke="#17181a" stroke-opacity="0.12"/>
<text x="56.0" y="296" class="m" font-size="10.5" letter-spacing="1.8" fill="#97958f">IMC PROSPERITY 4</text>
<text x="56.0" y="322" class="s" font-size="15" fill="#17181a">Finalist of 18,803 teams</text>
<text x="253.0" y="296" class="m" font-size="10.5" letter-spacing="1.8" fill="#97958f">VANTEDGE</text>
<text x="253.0" y="322" class="s" font-size="15" fill="#17181a">Co-founder, Head of DCM</text>
<text x="450.0" y="296" class="m" font-size="10.5" letter-spacing="1.8" fill="#97958f">BSQF</text>
<text x="450.0" y="322" class="s" font-size="15" fill="#17181a">Quant analyst, two papers</text>
<text x="647.0" y="296" class="m" font-size="10.5" letter-spacing="1.8" fill="#97958f">BOCCONI</text>
<text x="647.0" y="322" class="s" font-size="15" fill="#17181a">Computer Science 30L/30</text>
</g>
</g>
</svg>
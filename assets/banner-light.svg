<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Giovanni De Stasio. Finance at Bocconi, Milan. I study financial markets, build trading systems and develop apps.">
<style>
  .m { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .stage1 { opacity: 0; animation: stage1 2.75s linear backwards; }
  @keyframes stage1 { 0%, 92% { opacity: 1; } 100% { opacity: 0; } }
  .hide-until { animation-name: hidden; animation-timing-function: step-end; animation-fill-mode: backwards; }
  @keyframes hidden { from, to { opacity: 0; } }
  .cursor { animation: blink 0.9s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .rise { animation: rise 0.7s cubic-bezier(.22,1,.36,1) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .fade { animation: fade 0.35s ease-out backwards; }
  @keyframes fade { from { opacity: 0; } }
  .pick { fill-opacity: 0; animation: pick 0.12s ease-out 2.15s forwards; }
  @keyframes pick { to { fill-opacity: 1; } }
  .pick-text { animation: pickText 0.12s ease-out 2.15s forwards; }
  @keyframes pickText { to { fill: #f4f2ed; } }
  .bar { transform: scaleX(0); transform-origin: 0 0; animation: bar 0.45s cubic-bezier(.23,1,.32,1) 2.1999999999999997s forwards; }
  @keyframes bar { to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="900" height="380" rx="14" fill="#f4f2ed"/>
<g class="stage1">
<rect class="bar" x="0" y="0" width="900" height="2" fill="#2f8f57"/>
<text x="250" y="150" class="m" font-size="54" fill="#97958f">›</text>
<text x="302" y="150" class="m hide-until" font-size="54" letter-spacing="2" fill="#17181a" style="animation-duration:0.55s">G</text>
<text x="342" y="150" class="m hide-until" font-size="54" letter-spacing="2" fill="#17181a" style="animation-duration:0.74s">D</text>
<text x="382" y="150" class="m hide-until" font-size="54" letter-spacing="2" fill="#17181a" style="animation-duration:0.88s">S</text>
<rect class="cursor" x="428" y="108" width="24" height="48" fill="#17181a"/>
<g class="fade" style="animation-delay:1.15s">
<rect x="250" y="185" width="400" height="50" rx="9" fill="#17181a" class="pick"/>
<rect x="250.5" y="185.5" width="399" height="49" rx="9" fill="none" stroke="#17181a" stroke-opacity="0.18"/>
<text x="268" y="215" class="m pick-text" font-size="14" font-weight="600" letter-spacing="2" fill="#17181a">GDS</text>
<text x="324" y="215" class="m pick-text" font-size="13" fill="#6a6964">Giovanni De Stasio · Bocconi · Milan</text>
</g>
<g class="fade" style="animation-delay:1.3499999999999999s">
<text x="250" y="267" class="m" font-size="12" fill="#97958f">1 result</text>
